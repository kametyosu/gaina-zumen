<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>GAINA｜見積回答</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">G</div><strong>ガイナ <span>見積回答ポータル</span></strong><small>SUPPLIER PORTAL</small></header><main><div class="eyebrow">REQUEST FOR QUOTATION</div><h1>お見積のご回答</h1><p>ご依頼の仕様・数量をご確認のうえ、税抜単価と納期をご入力ください。</p><div id="status" role="status">依頼を確認しています…</div><section id="content" hidden><article><div class="title-row"><div><span>ご依頼先</span><h2 id="vendor"></h2></div><div><span>回答期限</span><h2 id="deadline"></h2></div></div><h3 id="project"></h3><p id="note"></p></article><form id="form"><article><h2>ご依頼の品目</h2><div id="lines"></div></article><article><h2>回答者・お見積条件</h2><div class="grid"><label>ご担当者名<input name="contact" maxlength="100" required autocomplete="name"></label><label>見積有効期限<input name="validUntil" type="date" required></label><label>送料・諸経費（税抜円）<input name="freight" type="number" min="0" max="10000000000" step="0.01" value="0" required></label><label>備考・保証条件<textarea name="note" maxlength="2000" rows="3"></textarea></label></div><div id="total"></div></article><div class="submit-row"><p>送信後も回答期限内は同じURLから修正できます。<br>この回答は発注確定を意味しません。</p><button id="submit" type="submit">回答を送信する →</button></div></form></section><footer>このURLは貴社専用です。第三者への転送はお控えください。</footer></main><script src="app.js" defer></script></body></html>
