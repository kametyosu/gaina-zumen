<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガイナ｜仕入・相見積</title><link rel="stylesheet" href="rfq.css"></head><body><aside class="side"><a class="logo" href="../"><span class="logo-icon">G</span>ガイナ</a><div class="side-caption">WORKSPACE</div><a href="../">▤　配線指示書</a><button data-nav="projects">▦　案件一覧</button><button class="side-parent" data-nav="compare">▱　仕入・相見積 <span>⌃</span></button><div class="subnav"><button data-nav="requests" class="active">依頼一覧</button><button data-nav="history">商品・価格履歴</button><button data-nav="market">価格改定情報 <i></i></button></div><div class="side-bottom"><button data-nav="settings">⚙　管理設定</button><div class="profile"><span>小</span><div>小西<small>ガイナ 業務管理</small></div></div></div></aside><main><header class="topbar"><div>仕入・相見積 <span>/</span> <b id="requestNumber"></b> <span id="modeBadge" class="badge neutral">サンプル</span></div><div class="top-actions"><select id="dataMode" aria-label="データ区分"><option value="sample">サンプルデータ</option><option value="live">自分のデータ</option></select><button id="help" class="icon-button" aria-label="機能と対応範囲">?</button><button id="settings" class="icon-button" aria-label="設定">⚙</button></div></header><div class="page-wrap"><div class="page-heading"><div><div class="eyebrow">PROCUREMENT WORKSPACE</div><h1 id="projectName"></h1><p id="pageSubtitle"></p></div><div class="heading-actions"><select id="requestSelect" aria-label="案件・依頼を切替"></select><button id="saveDraft">下書き保存</button></div></div><nav class="flow" id="flow" aria-label="業務の流れ"><button data-stage="request"><span>1</span><div>依頼する<small>資料を確認し、依頼を作成</small></div></button><button data-stage="compare"><span>2</span><div>金額を比べる<small>回答と送料込み総額を比較</small></div></button><button data-stage="adopt"><span>3</span><div>採用する<small>条件を確認し、発注明細へ</small></div></button></nav><div id="saveState" role="status"></div><section id="screen"></section><footer class="app-footer"><span>GAINA / 仕入・相
